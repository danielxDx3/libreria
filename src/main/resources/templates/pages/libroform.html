<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editando} ? 'Editar libro | Librería PUCE' : 'Registrar libro | Librería PUCE'">Registrar libro</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<main class="container content-main">
    <nav class="breadcrumb" aria-label="Ubicación">
        <a th:href="@{/}">Inicio</a> <span>/</span>
        <a th:href="@{/libros}">Catálogo</a> <span>/</span>
        <span th:text="${editando} ? 'Editar libro' : 'Nuevo libro'">Nuevo libro</span>
    </nav>
    <div class="form-card">
        <div class="section-heading">
            <span class="eyebrow">CATÁLOGO DE LIBROS</span>
            <h1 th:text="${editando} ? 'Editar información del libro' : 'Registrar un nuevo libro'">Registrar libro</h1>
            <p>Completa los datos. Todos los campos son obligatorios.</p>
        </div>

        <div class="alert alert-error" role="alert" th:if="${mensajeError}" th:text="${mensajeError}"></div>

        <form th:action="@{/libros/guardar}" th:object="${libro}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-grid">
                <div class="field field-wide">
                    <label for="titulo">Título del libro</label>
                    <input id="titulo" type="text" th:field="*{titulo}" maxlength="160" required
                           placeholder="Ej. El Principito" th:classappend="${#fields.hasErrors('titulo')} ? ' input-invalid' : ''">
                    <small class="field-error" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></small>
                </div>
                <div class="field">
                    <label for="editorial">Editorial</label>
                    <input id="editorial" type="text" th:field="*{editorial}" maxlength="120" required
                           placeholder="Ej. Salamandra" th:classappend="${#fields.hasErrors('editorial')} ? ' input-invalid' : ''">
                    <small class="field-error" th:if="${#fields.hasErrors('editorial')}" th:errors="*{editorial}"></small>
                </div>
                <div class="field">
                    <label for="genero">Género</label>
                    <select id="genero" th:field="*{genero}" required th:classappend="${#fields.hasErrors('genero')} ? ' input-invalid' : ''">
                        <option value="">Seleccione un género</option>
                        <option th:each="opcion : ${generos}" th:value="${opcion}" th:text="${opcion}"></option>
                    </select>
                    <small class="field-error" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}"></small>
                </div>
                <div class="field field-wide">
                    <label for="numeroPagina">Número de páginas</label>
                    <input id="numeroPagina" type="number" th:field="*{numeroPagina}" min="1" max="20000" required
                           placeholder="Ej. 96" th:classappend="${#fields.hasErrors('numeroPagina')} ? ' input-invalid' : ''">
                    <small class="field-error" th:if="${#fields.hasErrors('numeroPagina')}" th:errors="*{numeroPagina}"></small>
                </div>
            </div>
            <div class="form-actions">
                <a class="button button-secondary" th:href="@{/libros}">Cancelar</a>
                <button class="button button-primary" type="submit" th:text="${editando} ? 'Guardar cambios' : 'Registrar libro'">Registrar libro</button>
            </div>
        </form>
    </div>
</main>
<footer class="site-footer">Proyecto académico de gestión de libros · Spring Boot + H2</footer>
</body>
</html>
