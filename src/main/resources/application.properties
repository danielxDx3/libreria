spring.application.name=libreria

# Base de datos H2 embebida y temporal; no requiere PostgreSQL ni contrasena.
spring.datasource.url=jdbc:h2:mem:libreria;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crea las tablas al iniciar. Los libros se borran cuando se detiene la app.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

server.port=8080
