spring.application.name=libreria

# Conexion PostgreSQL (se pueden cambiar con variables de entorno DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/libreria}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Estu#26}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea/actualiza la tabla libros y conserva los registros al reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.thymeleaf.cache=false

server.port=8080
